    queries: ['"Habib Bank Limited"', '"HBL" bank Pakistan']
  UBL:
    strong_aliases: ["United Bank Limited", "UBL"]
    weak_aliases: ["United Bank"]
    context_words: ["Pakistan", "PSX", "profit", "dividend", "shares", "branch", "deposits", "banking"]
    exclude: ["United Bank for Africa", "United Bank of India", "UBA"]
    require_pk_context: true
    queries: ['"United Bank Limited"', '"UBL" bank Pakistan']
  MCB:
    strong_aliases: ["MCB Bank", "MCB"]
    weak_aliases: []
    context_words: []
    exclude: ["Mauritius Commercial Bank", "MCB Group", "Mauritius", "MCB Islamic", "MCB Funds", "MCB-Arif Habib",
              "MCB Arif Habib", "MCB Investment Management"]
