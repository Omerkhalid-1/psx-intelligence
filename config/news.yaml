    weak_aliases: []
    context_words: []
    exclude: []
    queries: ['"DG Khan Cement"', '"D.G. Khan Cement"']
  FCCL:
    strong_aliases: ["Fauji Cement", "FCCL"]
    weak_aliases: []
    context_words: []
    exclude: []
    queries: ['"Fauji Cement"']
  OGDC:
    strong_aliases: ["Oil and Gas Development Company", "Oil & Gas Development Company", "OGDCL", "OGDC"]
    weak_aliases: []
    context_words: []
    exclude: []
    queries: ['"OGDCL"', '"Oil and Gas Development Company"']
  PPL:
    strong_aliases: ["Pakistan Petroleum Limited", "Pakistan Petroleum Ltd"]
    weak_aliases: ["Pakistan Petroleum", "PPL"]
    context_words: ["gas", "oil", "field", "well", "discovery", "exploration", "block", "profit", "dividend", "bonus",
                    "shares", "PSX", "Sui", "E&P", "production"]
    exclude: ["Ministry of Petroleum", "Petroleum Division", "PPL Corporation", "PPL Electric", "PPL Corp"]
    require_pk_context: true
    queries: ['"Pakistan Petroleum Limited"', '"PPL" gas field Pakistan']
  HBL:
    strong_aliases: ["Habib Bank Limited", "Habib Bank", "HBL"]
    weak_aliases: []
    context_words: []
    exclude: ["HBL PSL", "PSL", "Pakistan Super League", "Habib Bank AG Zurich", "Habib Bank Zurich", "AG Zurich"]
