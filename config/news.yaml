    weak_aliases: []
    context_words: []
    exclude: []
    queries: ['"Indus Motor"', '"Toyota Indus"']

# Market-wide topics, stored under the pseudo-symbol MARKET (used for KSE100 and as context).
market:
  strong_aliases: ["KSE-100", "KSE100", "Pakistan Stock Exchange", "PSX", "State Bank of Pakistan", "SBP",
                   "policy rate", "monetary policy"]
  queries: ['"KSE-100"', '"Pakistan Stock Exchange"', '"State Bank of Pakistan" policy rate']

# Pakistani context used by entities with require_pk_context.
pk_context:
  publisher_domains: ["brecorder.com", "mettisglobal.news", "propakistani.pk", "dawn.com", "thenews.com.pk",
                      "tribune.com.pk", "profit.pakistantoday.com.pk", "pakistantoday.com.pk", "arabnews.pk",
                      "digitalpakistan.pk", "techjuice.pk", "nation.com.pk", "app.com.pk", "urdupoint.com",
                      "samaa.tv", "geo.tv", "aaj.tv", "dunyanews.tv", "bloompakistan.com", "nukta.com",
                      "thefridaytimes.com", "pakobserver.net", "dailytimes.com.pk", "psx.com.pk", "secp.gov.pk"]
  words: ["Pakistan", "Pakistani", "PSX", "KSE", "Lahore", "Karachi", "Islamabad", "SECP", "SBP", "PKR"]
  foreign_markers: ["NSE", "BSE", "₹", "crore", "lakh", "Sensex", "Nifty", "HKD", "HKEX", "ASX", "TSX", "LSE:",
                    "Nigeria", "Malawi", "Kenya", "Ghana"]

# Event categories by keyword (first match in this order wins). Matching is case-insensitive.
event_keywords:
  earnings: ["profit", "earnings", "EPS", "results", "revenue", "net income", "loss", "quarter", "1Q", "2Q", "3Q",
             "4Q", "half-year", "annual results", "CY2", "FY2"]
  dividend_corporate_action: ["dividend", "payout", "bonus", "stock split", "split", "rights issue", "book closure",
                              "buyback", "face value"]
  acquisition_strategy: ["acquire", "acquisition", "merger", "merge", "stake", "takeover", "divest"]
  contract_business: ["contract", "agreement", "partnership", "MoU", "launch", "expansion", "order", "deal",
                      "discovery", "field", "plant"]
  management_governance: ["CEO", "chairman", "board", "appoint", "resign", "director", "AGM", "EOGM"]
  legal_regulatory: ["SECP", "court", "lawsuit", "regulator", "penalty", "fine", "tax", "ban", "probe", "OGRA"]
  macro_policy: ["policy rate", "interest rate", "inflation", "CPI", "IMF", "budget", "rupee", "exchange rate",
                 "monetary policy", "SBP", "GDP"]
  sector: ["sector", "industry", "banks", "banking", "fertilizer", "urea", "E&P", "oil", "gas", "IT exports"]

# Provider politeness and limits.
provider:
  min_request_interval_seconds: 3.0
  timeout_seconds: 20
  max_items_per_feed: 100
  language: en
  region: PK

# On-demand symbol search (website news search) for symbols without curated rules above.
# Matching rules are derived from the listed company name; add exclusions here when a company name
# doubles as a brand for unrelated topics. Reviewed: claude-ai, 2026-10-21 (not human-verified).
search_overrides:
  HBL:
    exclude: ["HBL PSL", "Pakistan Super League", "PSL"]
