# News discovery configuration (Google News RSS). See docs/news_sentiment.md.
#
# aliases: phrases that identify the company in a headline (case-insensitive, whole words).
#   strong aliases identify the company on their own; weak aliases (short/ambiguous names) count
#   only when a context word also appears in the headline.
# queries: Google News search strings used for discovery (relevance is decided afterwards).

symbols:
  SYS:
    strong_aliases: ["Systems Limited", "Systems Ltd", "PSX:SYS", "SYS share", "SYS stock"]
    weak_aliases: ["Systems"]
    context_words: ["IT", "tech", "technology", "software", "PSX", "shares", "profit", "earnings", "dividend",
                    "bonus", "acquisition", "Confiz", "revenue", "exports", "stock split"]
    exclude: ["control systems", "systems engineering", "health systems", "payment systems"]
    # Many unrelated firms are called "<Name> Systems Limited" (mostly Indian listings): require
    # Pakistani context and veto foreign-market markers. Found via the evaluation set (sample 1).
    require_pk_context: true
    queries: ['"Systems Limited"', '"Systems Ltd" PSX']
  FFC:
    strong_aliases: ["Fauji Fertilizer Company", "Fauji Fertilizer Co", "FFC"]
    weak_aliases: ["Fauji Fertilizer"]
    context_words: ["urea", "fertilizer", "PSX", "profit", "dividend", "shares", "earnings", "FFBL", "Agritech"]
    exclude: ["Fauji Fertilizer Bin Qasim"]
    queries: ['"Fauji Fertilizer Company"', '"FFC" fertilizer PSX']
  MEBL:
    strong_aliases: ["Meezan Bank", "MEBL"]
    weak_aliases: []
    context_words: []
    exclude: []
    queries: ['"Meezan Bank"']
  MARI:
    strong_aliases: ["Mari Petroleum", "Mari Energies", "MARI"]
    weak_aliases: ["Mari"]
    context_words: ["gas", "oil", "field", "petroleum", "energy", "exploration", "PSX", "profit", "dividend",
                    "bonus", "shares", "Sui"]
    exclude: []
    queries: ['"Mari Petroleum"', '"Mari Energies"']

  # ---- Watchlist expansion (2026-10-21). Aliases are the names Pakistani press uses; ambiguous tickers and
  # names require Pakistani context. Reviewer: claude-ai (not human-verified) — validate against a labelled
  # sample before relying on per-symbol sentiment.
  LUCK:
    strong_aliases: ["Lucky Cement", "LUCK"]
    weak_aliases: []
    context_words: []
    exclude: ["Lucky Core", "Lucky Motor", "Lucky Textile", "Lucky Electric", "Lucky Star"]
