# Corporate actions that change share count (bonus issues, splits) for tracked symbols.
#
# This is curated reference data, NOT inferred from prices. Every entry must cite a public source
# for the ratio. `share_multiplier` = shares held after / shares held before (10% bonus -> 1.10,
# 800% bonus -> 9, 5-for-1 split -> 5). Historical prices before `ex_date` are divided by the
# multiplier to make them comparable with later prices (split/bonus adjustment only; cash dividends
# are recorded for reference and are NOT applied: targets are price returns, not total returns).
#
# ex_date: first session trading without entitlement. PSX did not publish a machine-readable
# ex-date in the cited sources, so ex_date is the session on which the price discontinuity occurs,
# checked to fall 1-3 sessions before the cited book-closure start (T+2 settlement). The loader
# re-verifies each entry against the stored price series (see `verify_against_prices`).
#
# status: verified = ratio from a cited source and ex_date consistent with book closure + prices.
# Reviewed by: Claude (AI) from public web sources on 2026-10-13. Needs human confirmation
# against the official PSX notices before being relied on for anything beyond research.

