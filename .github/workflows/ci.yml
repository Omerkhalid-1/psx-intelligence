# Lint + full test suite (with a real PostgreSQL, as in production) on every push and pull request.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: psx
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: psx_intelligence_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U psx -d psx_intelligence_test" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://psx:ci-throwaway@localhost:5432/psx_intelligence_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check app tests
      - name: Tests
        run: pytest -q
